  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxk_K2YT6Oxw75Dn8MpIQ5XxzYOnCel5w-nlLywbjooMsbuIX9xFIoamClr1aLDg9h4/exec";
    
    var google = window.google || {};
    google.script = google.script || {};
    google.script.run = {
      _success: null,
      _failure: null,
      withSuccessHandler: function(callback) { this._success = callback; return this; },
      withFailureHandler: function(callback) { this._failure = callback; return this; },

      verifyUserLogin: function(user, pass) { this._call('verifyUserLogin', { user, pass }); },
      registerNewUser: function(user, pass) { this._call('registerNewUser', { user, pass }); },
      verifyUserRole: function(username) { this._call('verifyUserRole', { username }); },
      searchGlobal: function(query) { this._call('searchGlobal', { query }); },
      getSpreadsheetData: function(role) { this._call('getSpreadsheetData', { role }); },
      updateCellInSheet: function(sheetName, rowIndex, fieldName, value, role, username) { this._call('updateCellInSheet', { sheetName, rowIndex, fieldName, value, role, username }); },
      addTermToSheet: function(sheetName, termData, role, username) { this._call('addTermToSheet', { sheetName, termData, role, username }); },
      addNewPageToSpreadsheet: function(title, icon, crowdinUrl, role, username) { this._call('addNewPageToSpreadsheet', { title, icon, crowdinUrl, role, username }); },
      deleteMultipleRowsFromSheet: function(sheetName, rowIndices, role, username) { this._call('deleteMultipleRowsFromSheet', { sheetName, rowIndices, role, username }); },
      updateAllStatusesInSheet: function(sheetName, status, role, username) { this._call('updateAllStatusesInSheet', { sheetName, status, role, username }); },
      getAuditLogsFromSheet: function() { this._call('getAuditLogsFromSheet', {}); },
      recordAuditLog: function(username, title, description) { this._call('recordAuditLog', { username, title, description }); },
      revertCellInSheet: function(sheetName, rowIndex, fieldName, oldValue, role, username) { this._call('revertCellInSheet', { sheetName, rowIndex, fieldName, oldValue, role, username }); },
      updatePageHeaderInfo: function(oldTitle, newTitle, desc, titleLink, icon, username) { this._call('updatePageHeaderInfo', { oldTitle, newTitle, desc, titleLink, icon, username }); },
      deleteMultiplePagesFromSpreadsheet: function(pageTitles, role, username) { this._call('deleteMultiplePagesFromSpreadsheet', { pageTitles, role, username }); },
      restoreDeletedPageFromSnapshot: function(snapshotPayload, role, username) { this._call('restoreDeletedPageFromSnapshot', { snapshotPayload, role, username }); },
      importJsonStringsToSheet: function(jsonDataString, role, username) { this._call('importJsonStringsToSheet', { jsonDataString, role, username }); },

      _call: function(actionName, payload) {
        const sc = this._success;
        const fc = this._failure;
        this._success = null;
        this._failure = null;
        fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: actionName, ...payload }) })
          .then(res => res.json())
          .then(data => { if (sc) sc(data); })
          .catch(err => { console.error("Erro na requisição:", err); if (fc) fc(err); });
      }
    };
    window.google = google;

    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
          colors: {
            sidebar: '#0b2863', sidebarDark: '#05122c', bgLight: '#f0f4f9', bgDark: '#07101e',
            cardBg: '#ffffff', cardBgDark: '#0d1b2a', accentBlue: '#2563eb', brandGreen: '#10b981',
            brandPurple: '#8b5cf6', brandPink: '#ec4899', brandSky: '#06b6d4'
          }
        }
      }
    };

    function toggleDarkMode() {
      const html = document.documentElement;
      html.classList.toggle('dark');
      const isDark = html.classList.contains('dark');
      const label = document.getElementById('themeLabel');
      if (label) label.innerText = isDark ? 'Modo Escuro' : 'Modo Claro';
      const circle = document.getElementById('themeToggleCircle');
      if (circle) circle.style.transform = isDark ? 'translateX(24px)' : 'translateX(0px)';
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }

    .fade-in { animation: fadeIn 0.2s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }

      0%, 100% { transform: translateX(0); }

/* Esconde TUDO antes do login */
body:not(.app-ready) #appMainContainer, 
body:not(.app-ready) #sidebarContainer, 
body:not(.app-ready) #topSearchBarContainer, 
body:not(.app-ready) footer {
  display: none !important;
}

/* Quando logado, mostra o app */
body.app-ready #appMainContainer { display: flex !important; }
body.app-ready #sidebarContainer { display: flex !important; }
body.app-ready #topSearchBarContainer { display: flex !important; }
body.app-ready footer { display: flex !important; }

/* Transição suave de entrada para views e troca de formulários */
.fade-in {
  animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* Entrada com escala para os cards internos dos modais */
@keyframes modalPop {
  from { opacity: 0; transform: scale(0.95) translateY(8px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-animate > div {
  animation: modalPop 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* Entrada e saída do Toast */
@keyframes toastSlideUp {
  from { opacity: 0; transform: translate(-50%, 16px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}
.toast-animate {
  animation: toastSlideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* Transição da tela de carregamento */
#loadingScreen {
  transition: opacity 0.25s ease-in-out;
}

/* === CENÁRIO ANIMADO DA TELA DE LOGIN === */
@keyframes cloudDrift {
  0% { transform: translateX(-220px); }
  100% { transform: translateX(calc(100vw + 220px)); }
}

@keyframes treeSway {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(2.2deg); }
}

@keyframes leafRustle {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(3px, -2px); }
}

@keyframes starTwinkle {
  0%, 100% { opacity: 0.25; transform: scale(0.9); }
  50% { opacity: 1; transform: scale(1.15); }
}

@keyframes fireflyFloat {
  0%, 100% { transform: translate(0, 0); opacity: 0.3; }
  33% { transform: translate(12px, -18px); opacity: 0.95; }
  66% { transform: translate(-10px, -28px); opacity: 0.6; }
}

.sky-cloud {
  position: absolute;
  background: rgba(255, 255, 255, 0.16);
  box-shadow: 0 6px 0 rgba(255, 255, 255, 0.08);
  animation: cloudDrift linear infinite;
}
.sky-cloud::before,
.sky-cloud::after {
  content: '';
  position: absolute;
  background: inherit;
}

.sky-star {
  position: absolute;
  width: 4px;
  height: 4px;
  background: #ffffff;
  animation: starTwinkle ease-in-out infinite;
}

.firefly {
  position: absolute;
  width: 5px;
  height: 5px;
  background: #a3e635;
  box-shadow: 0 0 8px #a3e635, 0 0 14px #4ade80;
  animation: fireflyFloat ease-in-out infinite;
}

.voxel-tree {
  transform-origin: bottom center;
  animation: treeSway 5.5s ease-in-out infinite;
}

.voxel-leaves {
  animation: leafRustle 3.8s ease-in-out infinite;
}

/* === VEGETAÇÃO EXTRA E ANIMAÇÕES DE INTERAÇÃO === */
@keyframes grassSway {
  0%, 100% { transform: skewX(0deg); }
  50% { transform: skewX(6deg); }
}

.grass-tuft {
  transform-origin: bottom center;
  animation: grassSway 3.2s ease-in-out infinite;
}

/* Ciclo sincronizado (18s): Ovelha e Porco caminham até o centro, param, pulam com coração e voltam */
@keyframes sheepWalkInteract {
  0%   { left: 16%; transform: scaleX(1) translateY(0); }
  28%  { left: 37%; transform: scaleX(1) translateY(0); }
  32%  { left: 37%; transform: scaleX(1) translateY(-6px); } /* Pulo de encontro */
  36%  { left: 37%; transform: scaleX(1) translateY(0); }
  48%  { left: 37%; transform: scaleX(1) translateY(0); }
  52%  { left: 37%; transform: scaleX(-1) translateY(0); } /* Vira para voltar */
  82%  { left: 16%; transform: scaleX(-1) translateY(0); }
  86%  { left: 16%; transform: scaleX(1) translateY(0); }
  100% { left: 16%; transform: scaleX(1) translateY(0); }
}

@keyframes pigWalkInteract {
  0%   { right: 18%; transform: scaleX(-1) translateY(0); }
  28%  { right: 39%; transform: scaleX(-1) translateY(0); }
  34%  { right: 39%; transform: scaleX(-1) translateY(-6px); } /* Pulo de resposta */
  38%  { right: 39%; transform: scaleX(-1) translateY(0); }
  48%  { right: 39%; transform: scaleX(-1) translateY(0); }
  52%  { right: 39%; transform: scaleX(1) translateY(0); } /* Vira para voltar */
  82%  { right: 18%; transform: scaleX(1) translateY(0); }
  86%  { right: 18%; transform: scaleX(-1) translateY(0); }
  100% { right: 18%; transform: scaleX(-1) translateY(0); }
}

/* Coração que aparece exatamente quando os dois se encontram (30% a 48% do ciclo) */
@keyframes interactionHeart {
  0%, 29%   { opacity: 0; transform: translate(-50%, 6px) scale(0.5); }
  34%       { opacity: 1; transform: translate(-50%, -10px) scale(1.15); }
  45%       { opacity: 1; transform: translate(-50%, -18px) scale(1); }
  50%, 100% { opacity: 0; transform: translate(-50%, -24px) scale(0.6); }
}

/* Galinha ciscando e dando pequenos pulos no canto direito */
@keyframes chickenHop {
  0%, 100% { transform: translateX(0) translateY(0) scaleX(-1); }
  20%      { transform: translateX(-18px) translateY(0) scaleX(-1); }
  25%      { transform: translateX(-18px) translateY(-5px) scaleX(-1); }
  30%      { transform: translateX(-18px) translateY(0) scaleX(-1); }
  50%      { transform: translateX(-18px) translateY(0) scaleX(1); }
  75%      { transform: translateX(0) translateY(0) scaleX(1); }
  80%      { transform: translateX(0) translateY(-4px) scaleX(1); }
  85%      { transform: translateX(0) translateY(0) scaleX(1); }
}

/* Movimento alternado das patinhas enquanto andam */
@keyframes legStepA {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-2px); }
}
@keyframes legStepB {
  0%, 100% { transform: translateY(-2px); }
  50%      { transform: translateY(0); }
}

.animal-sheep {
  position: absolute;
  bottom: 3.5rem; /* alinhado ao topo da grama (h-14) */
  animation: sheepWalkInteract 18s ease-in-out infinite;
}

.animal-pig {
  position: absolute;
  bottom: 3.5rem;
  animation: pigWalkInteract 18s ease-in-out infinite;
}

.animal-chicken {
  position: absolute;
  bottom: 3.5rem;
  right: 10%;
  animation: chickenHop 7s ease-in-out infinite;
}

.interaction-heart {
  position: absolute;
  bottom: 5.5rem;
  left: 49%;
  animation: interactionHeart 18s ease-in-out infinite;
}

.leg-a { animation: legStepA 0.45s infinite; }
.leg-b { animation: legStepB 0.45s infinite; }

/* === SISTEMA DE CLIMA DINÂMICO (MINECRAFT) === */
#authScreen {
  transition: background 1.2s ease-in-out;
}

/* Clima 0: Ensolarado / Céu Limpo */
#authScreen.weather-sunny {
  background: linear-gradient(to bottom, #1d4ed8, #3b82f6, #60a5fa) !important;
}

/* Clima 1 e 2: Nublado / Carregado */
#authScreen.weather-cloudy-1 {
  background: linear-gradient(to bottom, #1e293b, #334155, #475569) !important;
}
#authScreen.weather-cloudy-2 {
  background: linear-gradient(to bottom, #0f172a, #1e293b, #334155) !important;
}

/* Clima 3+: Tempestade */
#authScreen.weather-storm {
  background: linear-gradient(to bottom, #020617, #090d16, #111827) !important;
}

/* Nuvens carregadas */
.storm-cloud {
  position: absolute;
  background: #334155;
  box-shadow: 0 8px 0 #1e293b;
  opacity: 0;
  transition: opacity 1s ease-in-out, background-color 1s ease;
  animation: cloudDrift linear infinite;
}
.storm-cloud::before,
.storm-cloud::after {
  content: '';
  position: absolute;
  background: inherit;
}

#authScreen.weather-cloudy-1 .storm-cloud { opacity: 0.65; }
#authScreen.weather-cloudy-2 .storm-cloud,
#authScreen.weather-storm .storm-cloud {
  opacity: 0.95;
  background: #1e293b;
  box-shadow: 0 8px 0 #0f172a;
}

/* Gotas de chuva estilo Minecraft */
@keyframes mcRainFall {
  0% { transform: translateY(-10vh) translateX(0); }
  100% { transform: translateY(110vh) translateX(-25px); }
}

.mc-rain-drop {
  position: absolute;
  top: -20px;
  width: 2px;
  height: 16px;
  background: linear-gradient(to bottom, rgba(147, 197, 253, 0.2), rgba(96, 165, 250, 0.85));
  animation: mcRainFall linear infinite;
}

/* Flash do Relâmpago */
@keyframes lightningFlashAnim {
  0% { opacity: 0; }
  10% { opacity: 0.95; }
  25% { opacity: 0.15; }
  40% { opacity: 0.85; }
  100% { opacity: 0; }
}

.lightning-active {
  animation: lightningFlashAnim 0.45s ease-out forwards;
}

/* Raio pixelado no céu */
@keyframes boltStrikeAnim {
  0%, 100% { opacity: 0; }
  15%, 45% { opacity: 1; }
}

.bolt-active {
  animation: boltStrikeAnim 0.4s steps(2, end) forwards;
}

/* Centralização perfeita do botão de login e seus estados (loading / success) */
/* Centralização perfeita do botão preservando as animações */
#loginSubmitBtn {
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 0.5rem !important;
  position: relative;
}

#loginSubmitBtn svg,
#loginSubmitBtn i {
  position: static !important;
  inset: auto !important;
  margin: 0 !important;
  width: 20px;
  height: 20px;
  flex-shrink: 0;
}

#loginSubmitBtn span {
  display: inline-flex;
  align-items: center;
  line-height: 1;
}

/* Animação do ícone de check ao concluir */
@keyframes checkPopDraw {
  0% {
    opacity: 0;
    transform: scale(0.3) rotate(-15deg);
    stroke-dashoffset: 30;
  }
  60% {
    opacity: 1;
    transform: scale(1.2) rotate(0deg);
    stroke-dashoffset: 0;
  }
  100% {
    opacity: 1;
    transform: scale(1) rotate(0deg);
    stroke-dashoffset: 0;
  }
}

.anim-check-icon {
  stroke-dasharray: 30;
  animation: checkPopDraw 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
  </style>
</head>

      <!-- ÁRVORE 2 (Esquerda Fundo - Bétula / Árvore Média) -->
      <div class="voxel-tree hidden sm:flex absolute bottom-14 left-44 flex-col items-center" style="animation-delay: -1.8s;">
        <div class="voxel-leaves flex flex-col items-center -mb-1">
          <div class="w-12 h-5 bg-[#4ade80] border-b-4 border-[#16a34a]"></div>
          <div class="w-20 h-6 bg-[#22c55e] border-b-4 border-[#15803d] -mt-1"></div>
          <div class="w-24 h-7 bg-[#16a34a] border-b-4 border-[#166534] -mt-1"></div>
        </div>
        <div class="w-5 h-14 bg-[#e2e8f0] border-x-2 border-[#94a3b8] flex flex-col justify-around items-center py-1">
          <div class="w-3 h-1 bg-[#334155] self-start"></div>
          <div class="w-2.5 h-1 bg-[#334155] self-end"></div>
          <div class="w-3 h-1 bg-[#334155] self-start"></div>
        </div>
      </div>

      <!-- ÁRVORE 3 (Direita - Carvalho Alto) -->
      <div class="voxel-tree absolute bottom-14 right-6 sm:right-16 flex flex-col items-center" style="animation-delay: -2.7s;">
        <div class="voxel-leaves flex flex-col items-center -mb-2">
          <div class="w-14 h-6 bg-[#22c55e] border-b-4 border-[#15803d]"></div>
          <div class="w-24 h-8 bg-[#16a34a] border-b-4 border-[#166534] -mt-1"></div>
          <div class="w-32 h-9 bg-[#15803d] border-b-4 border-[#14532d] -mt-1 flex justify-around px-2 pt-2">
            <span class="w-2.5 h-2.5 bg-[#4ade80]/40"></span>
            <span class="w-2.5 h-2.5 bg-[#4ade80]/30"></span>
          </div>
        </div>
        <div class="w-7 h-24 bg-[#78350f] border-x-4 border-[#451a03] flex flex-col justify-around items-center py-1">
          <div class="w-2 h-5 bg-[#92400e]"></div>
          <div class="w-2 h-4 bg-[#451a03]"></div>
        </div>
      </div>

      <!-- VEGETAÇÃO RASTEIRA (Tufos de Grama e Flores espalhados pelo chão) -->
      <div class="absolute bottom-14 inset-x-0 h-6 flex items-end">
        <!-- Tufo 1 -->
        <div class="grass-tuft absolute left-[4%] flex items-end gap-0.5">
          <div class="w-1.5 h-3 bg-[#22c55e]"></div>
          <div class="w-1.5 h-5 bg-[#4ade80]"></div>
          <div class="w-1.5 h-3.5 bg-[#16a34a]"></div>
        </div>
        <!-- Flor Vermelha (Papoula) -->
        <div class="grass-tuft absolute left-[12%] flex flex-col items-center" style="animation-delay: -0.8s;">
          <div class="w-3 h-3 bg-red-500 border-t-2 border-red-300"></div>
          <div class="w-1 h-3 bg-[#16a34a]"></div>
        </div>
        <!-- Tufo 2 -->
        <div class="grass-tuft absolute left-[24%] flex items-end gap-0.5" style="animation-delay: -1.4s;">
          <div class="w-1.5 h-4 bg-[#4ade80]"></div>
          <div class="w-1.5 h-6 bg-[#22c55e]"></div>
          <div class="w-1.5 h-3 bg-[#16a34a]"></div>
        </div>
        <!-- Flor Amarela (Dente-de-leão) -->
        <div class="grass-tuft absolute left-[33%] flex flex-col items-center" style="animation-delay: -2.1s;">
          <div class="w-2.5 h-2.5 bg-yellow-300 border-t-2 border-yellow-100"></div>
          <div class="w-1 h-2.5 bg-[#16a34a]"></div>
        </div>
        <!-- Tufo 3 (Centro) -->
        <div class="grass-tuft absolute left-[48%] flex items-end gap-0.5" style="animation-delay: -0.5s;">
          <div class="w-1.5 h-3.5 bg-[#16a34a]"></div>
          <div class="w-1.5 h-5 bg-[#4ade80]"></div>
          <div class="w-1.5 h-4 bg-[#22c55e]"></div>
        </div>
        <!-- Tufo 4 -->
        <div class="grass-tuft absolute right-[32%] flex items-end gap-0.5" style="animation-delay: -1.9s;">
          <div class="w-1.5 h-3 bg-[#22c55e]"></div>
          <div class="w-1.5 h-4.5 bg-[#4ade80]"></div>
        </div>
        <!-- Flor Vermelha 2 -->
        <div class="grass-tuft absolute right-[24%] flex flex-col items-center" style="animation-delay: -1.1s;">
          <div class="w-3 h-3 bg-red-500 border-t-2 border-red-300"></div>
          <div class="w-1 h-3 bg-[#16a34a]"></div>
        </div>
        <!-- Tufo 5 -->
        <div class="grass-tuft absolute right-[6%] flex items-end gap-0.5" style="animation-delay: -2.4s;">
          <div class="w-1.5 h-4 bg-[#16a34a]"></div>
          <div class="w-1.5 h-6 bg-[#4ade80]"></div>
          <div class="w-1.5 h-3.5 bg-[#22c55e]"></div>
        </div>
      </div>

      <!-- Chão em blocos (Grama + Terra) -->
      <div class="absolute bottom-0 inset-x-0 h-14 flex flex-col">
        <div class="h-4 w-full bg-[#22c55e] border-t-4 border-[#4ade80]"></div>
        <div class="flex-1 w-full bg-[#713f12] border-t-4 border-[#854d0e]"></div>
      </div>
    </div>

    <!-- Card do Formulário -->
    <div class="relative z-10 w-full max-w-md bg-white dark:bg-cardBgDark border border-slate-200 dark:border-slate-800 rounded-[30px] p-8 shadow-2xl space-y-6">
      <div class="text-center space-y-2">
        <h2 id="authTitle" class="text-xl font-extrabold text-slate-800 dark:text-white tracking-tight">Bem-vindo(a) à documentação da Unidade 63!</h2>
        <p id="authSubtitle" class="text-xs text-slate-500 dark:text-slate-400">Digite suas credenciais abaixo para acessá-la</p>
      </div>

      <form id="loginFormContainer" onsubmit="handleLoginSubmit(event)" class="space-y-4">
        <div class="space-y-1">
          <label class="text-[11px] font-bold text-slate-600 dark:text-slate-300 uppercase tracking-wider">Nome de Usuário</label>
          <div class="relative">
            <i data-lucide="user" class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="loginUser" required placeholder="Ex.: Steve" class="auth-input w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl pl-11 pr-4 py-3 text-xs text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition-all">
          </div>
        </div>
        <div class="space-y-1">
          <label class="text-[11px] font-bold text-slate-600 dark:text-slate-300 uppercase tracking-wider">Senha</label>
          <div class="relative">
            <i data-lucide="key" class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="password" id="loginPass" required placeholder="••••••••••••" class="auth-input w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl pl-11 pr-4 py-3 text-xs text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition-all">
          </div>
          <p id="loginErrorMsg" class="text-[11px] font-semibold text-red-500 hidden pt-1 flex items-center gap-1">
            <i data-lucide="alert-circle" class="w-3.5 h-3.5 shrink-0"></i> Credenciais inválidas. Verifique usuário e senha.
          </p>
        </div>
        <button type="submit" id="loginSubmitBtn" class="w-full py-3.5 bg-accentBlue hover:bg-blue-700 text-white font-bold text-xs rounded-2xl shadow-lg shadow-blue-500/25 transition-all">Entrar</button>
        <div class="text-center pt-2">
          <span class="text-xs text-slate-500">Não tem uma conta? </span>
          <button type="button" onclick="switchAuthMode('register')" class="text-xs font-bold text-accentBlue hover:underline">Cadastre-se</button>
        </div>
      </form>

      <form id="registerFormContainer" onsubmit="handleRegisterSubmit(event)" class="space-y-4 hidden">
        <div class="space-y-1">
          <label class="text-[11px] font-bold text-slate-600 dark:text-slate-300 uppercase tracking-wider">Nome de Usuário</label>
          <div class="relative" id="regUserWrapper">
            <i data-lucide="user-plus" class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="regUser" required placeholder="Escolha um nome de usuário" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl pl-11 pr-4 py-3 text-xs text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition-all">
          </div>
        </div>
        <div class="space-y-1">
          <label class="text-[11px] font-bold text-slate-600 dark:text-slate-300 uppercase tracking-wider">Cadastrar Senha</label>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="password" id="regPass" required minlength="3" placeholder="Crie uma senha forte e com pelo menos 3 caracteres" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl pl-11 pr-4 py-3 text-xs text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition-all">
          </div>
        </div>
        <button type="submit" id="registerSubmitBtn" class="w-full py-3.5 bg-brandGreen hover:opacity-90 text-white font-bold text-xs rounded-2xl shadow-lg shadow-emerald-500/25 transition-all">Cadastrar</button>
        <div class="text-center pt-2">
          <span class="text-xs text-slate-500">Já possui uma conta? </span>
          <button type="button" onclick="switchAuthMode('login')" class="text-xs font-bold text-accentBlue hover:underline">Iniciar sessão</button>
        </div>
      </form>
    </div>
  </div>

  <div id="loadingScreen" class="fixed inset-0 bg-[#0b2863] z-[9999] hidden flex-col items-center justify-center space-y-4">
    <div class="relative flex items-center justify-center w-16 h-16">
      <iconify-icon icon="svg-spinners:blocks-wave" class="text-5xl text-white"></iconify-icon>
    </div>
    <div class="text-center space-y-1">
      <h3 class="text-sm font-bold font-mono text-white">Carregando informações...</h3>
      <p class="text-xs text-blue-200">Esta tela fechará após o carregamento</p>
    </div>
  </div>

  <div id="protectedAppRoot"></div>

  <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-xl z-50 hidden flex items-center gap-3 text-xs font-semibold">
    <i data-lucide="check-circle" class="w-4 h-4 text-brandGreen"></i><span id="toastMsg">Notificação...</span>
  </div>

  <script>
    let currentUserSession = null;
    let loadingWatchdog = null;
    let failedLoginAttempts = 0;
    let thunderInterval = null;
    let rainInitialized = false;

    function showLoading() {
      const el = document.getElementById('loadingScreen');
      if (el) {
        el.classList.remove('hidden');
        el.classList.add('flex');
      }
      clearTimeout(loadingWatchdog);
      loadingWatchdog = setTimeout(() => {
        hideLoading();
        showToast('O servidor demorou para responder. Tente sincronizar novamente.');
      }, 90000);
    }

    function hideLoading() {
      clearTimeout(loadingWatchdog);
      loadingWatchdog = null;
      const el = document.getElementById('loadingScreen');
      if (el) {
        el.classList.add('hidden');
        el.classList.remove('flex');
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      document.getElementById('toastMsg').innerText = msg;

      toast.classList.remove('hidden', 'toast-animate');
      void toast.offsetWidth;
      toast.classList.add('toast-animate');

      clearTimeout(toast._hideTimer);
      toast._hideTimer = setTimeout(() => toast.classList.add('hidden'), 2500);
    }

    function switchAuthMode(mode) {
      clearLoginErrorState();
      const loginForm = document.getElementById('loginFormContainer');
      const regForm = document.getElementById('registerFormContainer');

      if (mode === 'register') {
        loginForm.classList.add('hidden');
        regForm.classList.remove('hidden', 'fade-in');
        void regForm.offsetWidth;
        regForm.classList.add('fade-in');
        document.getElementById('authTitle').innerText = 'Cadastro';
        document.getElementById('authSubtitle').innerText = 'Cadastre-se para acessar a documentação';
      } else {
        regForm.classList.add('hidden');
        loginForm.classList.remove('hidden', 'fade-in');
        void loginForm.offsetWidth;
        loginForm.classList.add('fade-in');
        document.getElementById('authTitle').innerText = 'Bem-vindo(a) à documentação da Unidade 63';
        document.getElementById('authSubtitle').innerText = 'Digite suas credenciais para acessá-la';
      }
    }

    function clearLoginErrorState() {
      document.querySelectorAll('.auth-input').forEach(input => input.classList.remove('shake-input'));
      const errEl = document.getElementById('loginErrorMsg');
      if (errEl) errEl.classList.add('hidden');
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      clearLoginErrorState();
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value.trim();

      setMorphButtonState('loginSubmitBtn', 'loading', 'Entrar');

      google.script.run
        .withSuccessHandler(res => {
          if (res && res.success) {
            try {
              setMorphButtonState('loginSubmitBtn', 'success', 'Entrar');
              currentUserSession = res.user;

              // Restaura o clima ensolarado ao acertar as credenciais
              updateLoginWeather(0, true);

              setTimeout(() => {
                showLoading();
                document.getElementById('authScreen').classList.add('hidden');

                // Monta o AppPrincipal usando o HTML já retornado no login (res.appPayload)
                mountProtectedApp(res.appPayload);
                setupUIAfterLogin();
                loadSheetsData();
                startAutoRoleSync();
                showToast(`Bem-vindo(a), ${currentUserSession.username}!`);
                setMorphButtonState('loginSubmitBtn', 'default', 'Entrar');
              }, 750);
            } catch (err) {
              console.error('ERRO após login:', err);
              setMorphButtonState('loginSubmitBtn', 'default', 'Entrar');
              hideLoading();
              showToast('Erro ao inicializar o app: ' + err.message);
            }
          } else {
            failedLoginAttempts++;
            updateLoginWeather(failedLoginAttempts, false);

            setMorphButtonState('loginSubmitBtn', 'default', 'Entrar');
            document.querySelectorAll('.auth-input').forEach(input => input.classList.add('shake-input'));
            document.getElementById('loginErrorMsg').classList.remove('hidden');
            if (window.lucide) lucide.createIcons();
            setTimeout(() => {
              document.querySelectorAll('.auth-input').forEach(input => input.classList.remove('shake-input'));
            }, 500);
          }
        })
        .withFailureHandler(err => {
          setMorphButtonState('loginSubmitBtn', 'default', 'Entrar');
          console.error('Falha no login:', err);
          showToast('Erro de comunicação com o servidor. Tente novamente.');
        })
        .verifyUserLogin(user, pass);
    }

    function mountProtectedApp(htmlString) {
      const container = document.getElementById('protectedAppRoot');
      if (!container) return;

      container.innerHTML = htmlString;

      // Reexecuta os blocos <script> inseridos via innerHTML
      const scripts = container.querySelectorAll('script');
      scripts.forEach(oldScript => {
        const newScript = document.createElement('script');
        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
        oldScript.parentNode.replaceChild(newScript, oldScript);
      });
    }

    function handleRegisterSubmit(e) {
      e.preventDefault();
      const userEl = document.getElementById('regUser');
      const userWrapper = document.getElementById('regUserWrapper');
      const user = userEl.value.trim();
      const pass = document.getElementById('regPass').value.trim();

      setMorphButtonState('registerSubmitBtn', 'loading', 'Cadastrar');

      google.script.run
        .withSuccessHandler(res => {
          setMorphButtonState('registerSubmitBtn', 'default', 'Cadastrar');
          if (res && res.success) {
            userWrapper.classList.remove('shake-input');
            showToast('Cadastro realizado com sucesso! Faça login.');
            switchAuthMode('login');
          } else {
            userWrapper.classList.add('shake-input');
            setTimeout(() => userWrapper.classList.remove('shake-input'), 500);
            showToast((res && res.message) || 'Nome de usuário já existe.');
          }
        })
        .withFailureHandler(err => {
          setMorphButtonState('registerSubmitBtn', 'default', 'Cadastrar');
          console.error('Falha no cadastro:', err);
          showToast('Erro de comunicação com o servidor.');
        })
        .registerNewUser(user, pass);
    }

    function logoutSession() {
      if (typeof roleCheckInterval !== 'undefined' && roleCheckInterval) clearInterval(roleCheckInterval);
      if (thunderInterval) { clearInterval(thunderInterval); thunderInterval = null; }
      failedLoginAttempts = 0;
      hideLoading();
      currentUserSession = null;

      // Limpa o conteúdo protegido do DOM ao sair
      const container = document.getElementById('protectedAppRoot');
      if (container) container.innerHTML = '';

      document.body.classList.remove('app-ready');
      const authScreen = document.getElementById('authScreen');
      authScreen.classList.remove('hidden', 'weather-sunny', 'weather-cloudy-1', 'weather-cloudy-2', 'weather-storm');
      document.getElementById('mcRainLayer').classList.add('hidden');
      document.getElementById('mcSun').classList.add('hidden');
      document.getElementById('mcMoon').classList.remove('hidden');

      document.getElementById('loginUser').value = '';
      document.getElementById('loginPass').value = '';
      clearLoginErrorState();
    }

    function setMorphButtonState(btnId, state, defaultText) {
      const btn = document.getElementById(btnId);
      if (!btn) return;

      if (state === 'loading') {
        btn.disabled = true;
        btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i><span>Processando...</span>`;
        if (window.lucide) lucide.createIcons();
      } else if (state === 'success') {
        btn.disabled = true;
        btn.classList.add('bg-emerald-500', 'hover:bg-emerald-500');
        btn.innerHTML = `<i data-lucide="check" class="w-5 h-5 stroke-[2.5]"></i><span>Validado!</span>`;
        if (window.lucide) lucide.createIcons();
      } else {
        btn.disabled = false;
        btn.classList.remove('bg-emerald-500', 'hover:bg-emerald-500');
        btn.innerHTML = `<span>${defaultText}</span>`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
    });

    function initRainDrops() {
      if (rainInitialized) return;
      const rainLayer = document.getElementById('mcRainLayer');
      if (!rainLayer) return;
      let dropsHtml = '';
      for (let i = 0; i < 95; i++) {
        const left = Math.random() * 100;
        const duration = 0.55 + Math.random() * 0.45;
        const delay = Math.random() * -2;
        dropsHtml += `<div class="mc-rain-drop" style="left:${left}%; animation-duration:${duration}s; animation-delay:${delay}s;"></div>`;
      }
      rainLayer.innerHTML = dropsHtml;
      rainInitialized = true;
    }

    function playMinecraftThunderSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const duration = 2.4;
        const bufferSize = ctx.sampleRate * duration;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);

        for (let i = 0; i < bufferSize; i++) {
          const decay = Math.pow(1 - i / bufferSize, 1.8);
          data[i] = (Math.random() * 2 - 1) * decay;
        }

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(280, ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(55, ctx.currentTime + duration);

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.85, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        noise.start();
      } catch (e) {}
    }

    function triggerMinecraftThunder() {
      const flash = document.getElementById('mcLightningFlash');
      const bolt = document.getElementById('mcLightningBolt');
      if (bolt) {
        bolt.style.left = (15 + Math.random() * 70) + '%';
        bolt.classList.remove('bolt-active');
        void bolt.offsetWidth;
        bolt.classList.add('bolt-active');
      }
      if (flash) {
        flash.classList.remove('lightning-active');
        void flash.offsetWidth;
        flash.classList.add('lightning-active');
      }
      playMinecraftThunderSound();
    }

    function updateLoginWeather(attempts, isSunny = false) {
      const screen = document.getElementById('authScreen');
      const rainLayer = document.getElementById('mcRainLayer');
      const sun = document.getElementById('mcSun');
      const moon = document.getElementById('mcMoon');
      if (!screen) return;

      screen.classList.remove('weather-sunny', 'weather-cloudy-1', 'weather-cloudy-2', 'weather-storm');

      if (isSunny) {
        failedLoginAttempts = 0;
        if (thunderInterval) {
          clearInterval(thunderInterval);
          thunderInterval = null;
        }
        if (rainLayer) rainLayer.classList.add('hidden');
        if (moon) moon.classList.add('hidden');
        if (sun) sun.classList.remove('hidden');
        screen.classList.add('weather-sunny');
        return;
      }

      if (sun) sun.classList.add('hidden');
      if (moon) moon.classList.remove('hidden');

      if (attempts === 1) {
        screen.classList.add('weather-cloudy-1');
      } else if (attempts === 2) {
        screen.classList.add('weather-cloudy-2');
      } else if (attempts === 3) {
        screen.classList.add('weather-storm');
        initRainDrops();
        if (rainLayer) rainLayer.classList.remove('hidden');
      } else if (attempts >= 4) {
        screen.classList.add('weather-storm');
        initRainDrops();
        if (rainLayer) rainLayer.classList.remove('hidden');

        triggerMinecraftThunder();
        if (!thunderInterval) {
          thunderInterval = setInterval(() => {
            if (failedLoginAttempts >= 4 && !screen.classList.contains('hidden')) {
              triggerMinecraftThunder();
            }
          }, 5500);
        }
      }
    }
  </script>
</body>
