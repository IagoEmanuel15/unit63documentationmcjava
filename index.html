<!DOCTYPE html>
<html lang="pt-BR" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">  
  <title>Minecraft: Java Edition (Documentação)</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@zip.js/zip.js@2.7.52/dist/zip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwK84jYD_9pnlg3dYSjFIMOTUoMtEBsqL_XcXnnupcbBjbG4s1fVu5FXn1nyB_kkk6g/exec";
    
    var google = window.google || {};
    google.script = google.script || {};
    google.script.run = {
      _success: null,
      _failure: null,
      withSuccessHandler: function(callback) { this._success = callback; return this; },
      withFailureHandler: function(callback) { this._failure = callback; return this; },

      verifyUserLogin: function(user, pass) { this._call('verifyUserLogin', { user, pass }); },
      registerNewUser: function(user, pass) { this._call('registerNewUser', { user, pass }); },
      verifyUserRole: function(username) { this._call('verifyUserRole', { username }); },
      searchGlobal: function(query) { this._call('searchGlobal', { query }); },
      getSpreadsheetData: function(role) { this._call('getSpreadsheetData', { role }); },
      updateCellInSheet: function(sheetName, rowIndex, fieldName, value, role, username) { this._call('updateCellInSheet', { sheetName, rowIndex, fieldName, value, role, username }); },
      addTermToSheet: function(sheetName, termData, role, username) { this._call('addTermToSheet', { sheetName, termData, role, username }); },
      addNewPageToSpreadsheet: function(title, icon, crowdinUrl, role, username) { this._call('addNewPageToSpreadsheet', { title, icon, crowdinUrl, role, username }); },
      deleteMultipleRowsFromSheet: function(sheetName, rowIndices, role, username) { this._call('deleteMultipleRowsFromSheet', { sheetName, rowIndices, role, username }); },
      updateAllStatusesInSheet: function(sheetName, status, role, username) { this._call('updateAllStatusesInSheet', { sheetName, status, role, username }); },
      getAuditLogsFromSheet: function() { this._call('getAuditLogsFromSheet', {}); },
      recordAuditLog: function(username, title, description) { this._call('recordAuditLog', { username, title, description }); },
      revertCellInSheet: function(sheetName, rowIndex, fieldName, oldValue, role, username) { this._call('revertCellInSheet', { sheetName, rowIndex, fieldName, oldValue, role, username }); },
      updatePageHeaderInfo: function(oldTitle, newTitle, desc, titleLink, icon, username) { this._call('updatePageHeaderInfo', { oldTitle, newTitle, desc, titleLink, icon, username }); },
      deleteMultiplePagesFromSpreadsheet: function(pageTitles, role, username) { this._call('deleteMultiplePagesFromSpreadsheet', { pageTitles, role, username }); },
      restoreDeletedPageFromSnapshot: function(snapshotPayload, role, username) { this._call('restoreDeletedPageFromSnapshot', { snapshotPayload, role, username }); },
      importJsonStringsToSheet: function(jsonDataString, role, username) { this._call('importJsonStringsToSheet', { jsonDataString, role, username }); },

      _call: function(actionName, payload) {
        const sc = this._success;
        const fc = this._failure;
        this._success = null;
        this._failure = null;
        fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: actionName, ...payload }) })
          .then(res => res.json())
          .then(data => { if (sc) sc(data); })
          .catch(err => { console.error("Erro na requisição:", err); if (fc) fc(err); });
      }
    };
    window.google = google;

    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
          colors: {
            sidebar: '#0b2863', sidebarDark: '#05122c', bgLight: '#f0f4f9', bgDark: '#07101e',
            cardBg: '#ffffff', cardBgDark: '#0d1b2a', accentBlue: '#2563eb', brandGreen: '#10b981',
            brandPurple: '#8b5cf6', brandPink: '#ec4899', brandSky: '#06b6d4'
          }
        }
      }
    };

    function toggleDarkMode() {
      const html = document.documentElement;
      html.classList.toggle('dark');
      const isDark = html.classList.contains('dark');
      const label = document.getElementById('themeLabel');
      if (label) label.innerText = isDark ? 'Modo Escuro' : 'Modo Claro';
      const circle = document.getElementById('themeToggleCircle');
      if (circle) circle.style.transform = isDark ? 'translateX(24px)' : 'translateX(0px)';
      if (typeof window.syncPaperCutTheme === 'function') {
        window.syncPaperCutTheme();
      }
    }
  </script>
  <style>
    /* Garante scroll suave e evita estouro horizontal */
    html, body {
      max-width: 100vw;
      overflow-x: hidden;
    }

    /* Em telas pequenas, a tabela mantém largura mínima legível com scroll horizontal suave */
    @media (max-width: 1024px) {
      #pageViewContainer table {
        min-width: 780px;
      }
      #alphabetMatrixContainer {
        min-width: unset !important;
        flex-wrap: nowrap;
        scroll-snap-type: x mandatory;
      }
      #alphabetMatrixContainer > div {
        scroll-snap-align: start;
        width: 85vw;
        max-width: 320px;
      }
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
    .fade-in { animation: fadeIn 0.2s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake-input { animation: shakeError 0.4s ease-in-out; border-color: #ef4444 !important; background-color: rgba(239, 68, 68, 0.05) !important; }
    textarea.auto-resize-textarea {
      resize: none;
      overflow-y: hidden;
      min-height: 32px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.4;
      display: block;
      box-sizing: border-box;
    }

    /* Esconde TUDO antes do login */
    body:not(.app-ready) #appMainContainer, 
    body:not(.app-ready) #sidebarContainer, 
    body:not(.app-ready) #topSearchBarContainer, 
    body:not(.app-ready) footer {
      display: none !important;
    }

    /* Quando logado, mostra o app */
    body.app-ready #appMainContainer { display: flex !important; }
    body.app-ready #sidebarContainer { display: flex !important; }
    body.app-ready #topSearchBarContainer { display: flex !important; }
    body.app-ready footer { display: flex !important; }

    /* Transição suave de entrada para views e troca de formulários */
    .fade-in {
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Entrada com escala para os cards internos dos modais */
    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.95) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-animate > div {
      animation: modalPop 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Entrada e saída do Toast */
    @keyframes toastSlideUp {
      from { opacity: 0; transform: translate(-50%, 16px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    .toast-animate {
      animation: toastSlideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Transição da tela de carregamento */
    #loadingScreen {
      transition: opacity 0.25s ease-in-out;
    }

    /* === FUNDO UNIFORME SEM GRADE DE PIXEL === */
    .login-pixel-grid {
      background-color: #ffffff;
      background-image: none;
    }

    .dark .login-pixel-grid {
      background-color: #07101e;
      background-image: none;
    }

    /* === NOVA ANIMAÇÃO DO LADO DIREITO: CASCATA DE ARQUIVOS + DIVISÓRIA PAPER-CUT === */
    .depth-viewport {
      position: relative;
      overflow: hidden;
      background: #05120e;
      --hud-accent: #00f5c4;
    }

    #translationCascadeCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    .green-flash-overlay {
      position: absolute;
      inset: 0;
      z-index: 8;
      pointer-events: none;
      background: radial-gradient(circle at 60% 50%, rgba(0, 255, 179, 0.34) 0%, rgba(0, 215, 145, 0.14) 65%, transparent 100%);
      opacity: 0;
      mix-blend-mode: screen;
    }

    .papercut-wrapper {
      position: absolute;
      inset: -1%;
      width: 102%;
      height: 102%;
      z-index: 5;
      pointer-events: none;
    }

    .cut-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      will-change: transform;
      transform-origin: 18% 50%;
    }

    .shadow-l1 { filter: drop-shadow(16px 0 22px rgba(2, 6, 23, 0.48)); }
    .shadow-l2 { filter: drop-shadow(14px 4px 20px rgba(0, 0, 0, 0.65)); }
    .shadow-l3 { filter: drop-shadow(12px 6px 18px rgba(0, 0, 0, 0.78)); }
    .shadow-l4 { filter: drop-shadow(10px 8px 16px rgba(0, 0, 0, 0.88)); }

    .edge-glow {
      stroke-dasharray: 180 620;
      animation: tracePulse 9s linear infinite;
    }
    .edge-glow-delay {
      stroke-dasharray: 120 540;
      animation: tracePulse 11s linear infinite reverse;
    }

    @keyframes tracePulse {
      0% { stroke-dashoffset: 800; }
      100% { stroke-dashoffset: 0; }
    }

    /* Centralização perfeita do botão de login e seus estados (loading / success) */
    #loginSubmitBtn {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 0.5rem !important;
      position: relative;
    }

    #loginSubmitBtn svg,
    #loginSubmitBtn i {
      position: static !important;
      inset: auto !important;
      margin: 0 !important;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    #loginSubmitBtn span {
      display: inline-flex;
      align-items: center;
      line-height: 1;
    }

    /* Animação do ícone de check ao concluir */
    @keyframes checkPopDraw {
      0% {
        opacity: 0;
        transform: scale(0.3) rotate(-15deg);
        stroke-dashoffset: 30;
      }
      60% {
        opacity: 1;
        transform: scale(1.2) rotate(0deg);
        stroke-dashoffset: 0;
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
        stroke-dashoffset: 0;
      }
    }

    .anim-check-icon {
      stroke-dasharray: 30;
      animation: checkPopDraw 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
  </style>
</head>

    <div class="relative flex items-center justify-center w-16 h-16">
      <iconify-icon icon="svg-spinners:blocks-wave" class="text-5xl text-white"></iconify-icon>
    </div>
    <div class="text-center space-y-1">
      <h3 class="text-sm font-bold font-mono text-white">Carregando informações...</h3>

  <div id="protectedAppRoot"></div>

  <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-xl z-50 hidden flex items-center gap-3 text-xs font-semibold">
    <i data-lucide="check-circle" class="w-4 h-4 text-brandGreen"></i><span id="toastMsg">Notificação...</span>
  </div>

  <script>
    let currentUserSession = null;
    let loadingWatchdog = null;
    let failedLoginAttempts = 0;

    function showLoading() {
      const el = document.getElementById('loadingScreen');
      if (el) {
        el.classList.remove('hidden');
        el.classList.add('flex');
      }
      clearTimeout(loadingWatchdog);
      loadingWatchdog = setTimeout(() => {
        hideLoading();
        showToast('O servidor demorou para responder. Tente sincronizar novamente.');
      }, 90000);
    }

    function hideLoading() {
      clearTimeout(loadingWatchdog);
      loadingWatchdog = null;
      const el = document.getElementById('loadingScreen');
      if (el) {
        el.classList.add('hidden');
        el.classList.remove('flex');
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      const toastMsg = document.getElementById('toastMsg');
      if (toastMsg) toastMsg.innerText = msg;

      toast.classList.remove('hidden', 'toast-animate');
      void toast.offsetWidth;
      toast.classList.add('toast-animate');

      clearTimeout(toast._hideTimer);
      toast._hideTimer = setTimeout(() => toast.classList.add('hidden'), 2500);
    }

    function clearLoginErrorState() {
      document.querySelectorAll('.auth-input').forEach(input => input.classList.remove('shake-input'));
      const errEl = document.getElementById('loginErrorMsg');
      if (errEl) errEl.classList.add('hidden');
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      clearLoginErrorState();
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value.trim();

      setMorphButtonState('loginSubmitBtn', 'loading', 'Entrar');

      google.script.run
        .withSuccessHandler(res => {
          if (res && res.success) {
            try {
              setMorphButtonState('loginSubmitBtn', 'success', 'Entrar');
              currentUserSession = res.user;
              failedLoginAttempts = 0;

              if (typeof window.cascadeTriggerSuccessState === 'function') {
                window.cascadeTriggerSuccessState();
              }

              setTimeout(() => {
                showLoading();
                document.getElementById('authScreen').classList.add('hidden');

                mountProtectedApp(res.appPayload);
                setupUIAfterLogin();
                loadSheetsData();
                startAutoRoleSync();
                showToast(`Bem-vindo(a), ${currentUserSession.username}!`);
                setMorphButtonState('loginSubmitBtn', 'default', 'Entrar');
              }, 750);
            } catch (err) {
              console.error('ERRO após login:', err);
              setMorphButtonState('loginSubmitBtn', 'default', 'Entrar');
              hideLoading();
              showToast('Erro ao inicializar o app: ' + err.message);
            }
          } else {
            failedLoginAttempts++;
            if (typeof window.cascadeRegisterFailedAttempt === 'function') {
              window.cascadeRegisterFailedAttempt(failedLoginAttempts);
            }

            setMorphButtonState('loginSubmitBtn', 'default', 'Entrar');
            document.querySelectorAll('.auth-input').forEach(input => input.classList.add('shake-input'));
            const errEl = document.getElementById('loginErrorMsg');
            if (errEl) errEl.classList.remove('hidden');
            if (window.lucide) lucide.createIcons();
            setTimeout(() => {
              document.querySelectorAll('.auth-input').forEach(input => input.classList.remove('shake-input'));
            }, 500);
          }
        })
        .withFailureHandler(err => {
          setMorphButtonState('loginSubmitBtn', 'default', 'Entrar');
          console.error('Falha no login:', err);
          showToast('Erro de comunicação com o servidor. Tente novamente.');
        })
        .verifyUserLogin(user, pass);
    }

    function mountProtectedApp(htmlString) {
      const container = document.getElementById('protectedAppRoot');
      if (!container) return;

      container.innerHTML = htmlString;

      const scripts = container.querySelectorAll('script');
      scripts.forEach(oldScript => {
        const newScript = document.createElement('script');
        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
        oldScript.parentNode.replaceChild(newScript, oldScript);
      });
    }

    function logoutSession() {
      if (typeof roleCheckInterval !== 'undefined' && roleCheckInterval) clearInterval(roleCheckInterval);
      failedLoginAttempts = 0;
      hideLoading();
      currentUserSession = null;

      const container = document.getElementById('protectedAppRoot');
      if (container) container.innerHTML = '';

      document.body.classList.remove('app-ready');
      const authScreen = document.getElementById('authScreen');
      if (authScreen) authScreen.classList.remove('hidden');

      if (typeof window.cascadeResetState === 'function') {
        window.cascadeResetState();
      }

      const uInput = document.getElementById('loginUser');
      const pInput = document.getElementById('loginPass');
      if (uInput) uInput.value = '';
      if (pInput) pInput.value = '';
      clearLoginErrorState();
    }

    function setMorphButtonState(btnId, state, defaultText) {
      const btn = document.getElementById(btnId);
      if (!btn) return;

      if (state === 'loading') {
        btn.disabled = true;
        btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i><span>Processando...</span>`;
        if (window.lucide) lucide.createIcons();
      } else if (state === 'success') {
        btn.disabled = true;
        btn.classList.add('bg-emerald-500', 'hover:bg-emerald-500');
        btn.innerHTML = `<i data-lucide="check" class="w-5 h-5 stroke-[2.5]"></i><span>Validado!</span>`;
        if (window.lucide) lucide.createIcons();
      } else {
        btn.disabled = false;
        btn.classList.remove('bg-emerald-500', 'hover:bg-emerald-500');
        btn.innerHTML = `<span>${defaultText}</span>`;
      }
    }

    /* ================= CONTROLADOR DA ANIMAÇÃO: CASCATA DE ARQUIVOS & PAPER-CUT ================= */
    function initTranslationCascade() {
      if (window.lucide) lucide.createIcons();

      const canvas = document.getElementById('translationCascadeCanvas');
      const viewport = document.getElementById('depthViewport');
      if (!canvas || !viewport) return;

      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      const layerElements = document.querySelectorAll('.cut-layer');
      const greenFlashOverlay = document.getElementById('greenFlashOverlay');

      let width = 800;
      let height = 600;

      let errorCount = 0;
      let targetRedLevel = 0;
      let currentRedLevel = 0;
      let targetOutbreakLevel = 0;
      let currentOutbreakLevel = 0;

      let borderPulseEnergy = 0;
      let borderPulseTime = 0;

      function setAttr(id, attr, val) {
        const el = document.getElementById(id);
        if (el) el.setAttribute(attr, val);
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function lerpColor(rgb1, rgb2, t) {
        const c = Math.max(0, Math.min(1, t));
        return 'rgb(' +
          Math.round(lerp(rgb1[0], rgb2[0], c)) + ', ' +
          Math.round(lerp(rgb1[1], rgb2[1], c)) + ', ' +
          Math.round(lerp(rgb1[2], rgb2[2], c)) + ')';
      }

      function lerpRgba(rgb1, rgb2, t, alpha) {
        const c = Math.max(0, Math.min(1, t));
        return 'rgba(' +
          Math.round(lerp(rgb1[0], rgb2[0], c)) + ', ' +
          Math.round(lerp(rgb1[1], rgb2[1], c)) + ', ' +
          Math.round(lerp(rgb1[2], rgb2[2], c)) + ', ' +
          alpha.toFixed(3) + ')';
      }

      const PALETTE = {
        bgTop:     [[7, 26, 21],     [44, 9, 14]],
        bgBottom:  [[3, 12, 9],      [20, 4, 6]],
        primary:   [[0, 245, 196],   [255, 62, 82]],
        secondary: [[0, 212, 255],   [255, 118, 96]],
        l4_1:      [[11, 36, 29],    [54, 11, 17]],
        l4_2:      [[17, 54, 44],    [82, 16, 25]],
        l4_3:      [[7, 25, 20],     [32, 5, 9]],
        l3_1:      [[25, 61, 51],    [88, 20, 30]],
        l3_2:      [[35, 82, 69],    [120, 28, 40]],
        l3_3:      [[20, 50, 42],    [66, 14, 21]],
        l2_1:      [[139, 150, 147], [164, 122, 127]],
        l2_2:      [[108, 120, 117], [134, 88, 94]],
        l2_3:      [[78, 89, 86],    [98, 58, 63]]
      };

      const FILE_TEMPLATES = [
        { name: 'en_US_core.json',   lang: 'EN -> PT', line1: '"block.minecraft.stone"', line2: '"Pedra"' },
        { name: 'ja_JP_ui.json',     lang: 'JA -> PT', line1: '"設定を保存"',            line2: '"Salvar opções"' },
        { name: 'de_DE_terms.xliff', lang: 'DE -> PT', line1: '"Verbindung"',            line2: '"Conexão"' },
        { name: 'fr_FR_items.json',  lang: 'FR -> PT', line1: '"Épée en diamant"',       line2: '"Espada de diamante"' },
        { name: 'es_ES_docs.arb',    lang: 'ES -> PT', line1: '"Archivo listo"',         line2: '"Arquivo pronto"' },
        { name: 'ko_KR_str.json',    lang: 'KO -> PT', line1: '"데이터 동기화"',         line2: '"Sincronizar"' },
        { name: 'it_IT_pack.xliff',  lang: 'IT -> PT', line1: '"Traduzione"',            line2: '"Tradução"' },
        { name: 'zh_CN_lex.json',    lang: 'ZH -> PT', line1: '"安全通道"',              line2: '"Canal seguro"' },
        { name: 'ru_RU_sys.po',      lang: 'RU -> PT', line1: '"Перевод файла"',         line2: '"Traduzir arq."' },
        { name: 'ar_SA_bidi.tmx',    lang: 'AR -> PT', line1: '"ترجمة فورية"',           line2: '"Tradução real"' }
      ];

      const VIRUS_LABELS = [
        'TROJAN.LOC.EXE',
        'WORM.UTF8.SYS',
        'MALWARE.JSON',
        'ROOTKIT.BIN',
        'PAYLOAD.0x9F',
        'INFECT.NODE'
      ];

      const GLITCH_CHARS = '#$%&@!?*01X<>~^/|';

      function corruptString(str, severity) {
        if (severity <= 0.02) return str;
        let out = '';
        for (let i = 0; i < str.length; i++) {
          if (str[i] === ' ') {
            out += ' ';
          } else if (Math.random() < severity * 0.65) {
            out += GLITCH_CHARS[Math.floor(Math.random() * GLITCH_CHARS.length)];
          } else {
            out += str[i];
          }
        }
        return out;
      }

      const TOTAL_FILES = 26;
      const cascadeFiles = [];

      function initCascadeFiles() {
        cascadeFiles.length = 0;
        const cols = 5;
        for (let i = 0; i < TOTAL_FILES; i++) {
          const col = i % cols;
          const depth = (i % 3) * 0.35 + 0.25;
          const tpl = FILE_TEMPLATES[i % FILE_TEMPLATES.length];
          cascadeFiles.push({
            colRatio: (col + 0.5) / cols + (Math.random() - 0.5) * 0.05,
            yNorm: Math.random(),
            speed: (0.042 + depth * 0.055) * (0.88 + Math.random() * 0.24),
            depth: depth,
            tpl: tpl,
            corrupted: false,
            broken: false,
            vanishing: false,
            opacity: 1.0,
            targetOpacity: 1.0,
            rank: Math.random(),
            roleSeed: Math.random(),
            swayPhase: Math.random() * Math.PI * 2
          });
        }
        cascadeFiles.sort((a, b) => a.depth - b.depth);
      }

      const VIRUS_COUNT = 12;
      const virusEntities = [];
      for (let i = 0; i < VIRUS_COUNT; i++) {
        virusEntities.push({
          colRatio: ((i % 5) + 0.5) / 5 + (Math.random() - 0.5) * 0.14,
          yNorm: Math.random(),
          speed: 0.055 + Math.random() * 0.045,
          size: 14 + Math.random() * 10,
          label: VIRUS_LABELS[i % VIRUS_LABELS.length],
          phase: Math.random() * Math.PI * 2,
          wobbleFreq: 2.2 + Math.random() * 1.8
        });
      }

      function updateFilesState(corruptRatio, isOutbreak) {
        for (let i = 0; i < cascadeFiles.length; i++) {
          const f = cascadeFiles[i];
          f.corrupted = f.rank < corruptRatio;

          if (isOutbreak) {
            if (f.roleSeed < 0.42) {
              f.broken = true;
              f.vanishing = false;
              f.targetOpacity = 0.85;
            } else if (f.roleSeed < 0.82) {
              f.broken = false;
              f.vanishing = true;
              f.targetOpacity = 0.0;
            } else {
              f.broken = false;
              f.vanishing = false;
              f.targetOpacity = 0.95;
            }
          } else {
            f.broken = false;
            f.vanishing = false;
            f.targetOpacity = 1.0;
          }
        }
      }

      window.cascadeRegisterFailedAttempt = function (attempts) {
        errorCount = typeof attempts === 'number' ? attempts : (errorCount + 1);
        borderPulseEnergy = 1.0;
        borderPulseTime = 0;
        targetRedLevel = Math.min(1.0, errorCount / 3.5);

        if (errorCount < 4) {
          targetOutbreakLevel = 0;
          updateFilesState(errorCount / 3, false);
        } else {
          targetOutbreakLevel = 1.0;
          updateFilesState(1.0, true);
        }
      };

      window.cascadeTriggerSuccessState = function () {
        errorCount = 0;
        targetRedLevel = 0;
        targetOutbreakLevel = 0;
        borderPulseEnergy = 0.45;
        borderPulseTime = 0;

        for (let i = 0; i < cascadeFiles.length; i++) {
          const file = cascadeFiles[i];
          file.corrupted = false;
          file.broken = false;
          file.vanishing = false;
          file.targetOpacity = 1.0;
        }

        if (greenFlashOverlay) {
          greenFlashOverlay.style.transition = 'none';
          greenFlashOverlay.style.opacity = '0.5';
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              greenFlashOverlay.style.transition = 'opacity 0.9s ease-out';
              greenFlashOverlay.style.opacity = '0';
            });
          });
        }
      };

      window.cascadeResetState = function () {
        errorCount = 0;
        targetRedLevel = 0;
        currentRedLevel = 0;
        targetOutbreakLevel = 0;
        currentOutbreakLevel = 0;
        borderPulseEnergy = 0;
        for (let i = 0; i < cascadeFiles.length; i++) {
          const file = cascadeFiles[i];
          file.corrupted = false;
          file.broken = false;
          file.vanishing = false;
          file.opacity = 1.0;
          file.targetOpacity = 1.0;
        }
      };

      window.syncPaperCutTheme = function () {};

      function applySvgGradientColors(t, pulseHighlight) {
        setAttr('l4Stop1', 'stop-color', lerpColor(PALETTE.l4_1[0], PALETTE.l4_1[1], t));
        setAttr('l4Stop2', 'stop-color', lerpColor(PALETTE.l4_2[0], PALETTE.l4_2[1], t));
        setAttr('l4Stop3', 'stop-color', lerpColor(PALETTE.l4_3[0], PALETTE.l4_3[1], t));

        const strokeAlpha = 0.32 + pulseHighlight * 0.48;
        const strokeWidth = 2.0 + pulseHighlight * 1.6;
        setAttr('l4Stroke', 'stroke', lerpRgba(PALETTE.primary[0], PALETTE.primary[1], t, strokeAlpha));
        setAttr('l4Stroke', 'stroke-width', strokeWidth.toFixed(2));
        setAttr('l4Glow', 'stroke', lerpColor(PALETTE.primary[0], PALETTE.primary[1], t));
        setAttr('l4GlowRight', 'stroke', lerpColor(PALETTE.secondary[0], PALETTE.secondary[1], t));

        setAttr('l3Stop1', 'stop-color', lerpColor(PALETTE.l3_1[0], PALETTE.l3_1[1], t));
        setAttr('l3Stop2', 'stop-color', lerpColor(PALETTE.l3_2[0], PALETTE.l3_2[1], t));
        setAttr('l3Stop3', 'stop-color', lerpColor(PALETTE.l3_3[0], PALETTE.l3_3[1], t));
        setAttr('l3Stroke', 'stroke', lerpRgba(PALETTE.primary[0], PALETTE.primary[1], t, 0.34 + pulseHighlight * 0.45));
        setAttr('l3Stroke', 'stroke-width', (1.8 + pulseHighlight * 1.4).toFixed(2));
        setAttr('l3StrokeRight', 'stroke', lerpRgba(PALETTE.secondary[0], PALETTE.secondary[1], t, 0.3 + pulseHighlight * 0.4));

        setAttr('l2Stop1', 'stop-color', lerpColor(PALETTE.l2_1[0], PALETTE.l2_1[1], t));
        setAttr('l2Stop2', 'stop-color', lerpColor(PALETTE.l2_2[0], PALETTE.l2_2[1], t));
        setAttr('l2Stop3', 'stop-color', lerpColor(PALETTE.l2_3[0], PALETTE.l2_3[1], t));
        setAttr('l2Glow', 'stroke', lerpRgba([255, 255, 255], [255, 145, 155], t, 0.68 + pulseHighlight * 0.3));
      }

      function syncCanvasSize() {
        const rect = viewport.getBoundingClientRect();
        const fallbackW = window.innerWidth >= 1024 ? Math.round(window.innerWidth * 0.5833) : window.innerWidth;
        const fallbackH = window.innerHeight || 600;
        const w = Math.round(rect.width || viewport.clientWidth || fallbackW);
        const h = Math.round(rect.height || viewport.clientHeight || fallbackH);
        if (w > 0 && h > 0 && (canvas.width !== w || canvas.height !== h)) {
          width = canvas.width = w;
          height = canvas.height = h;
        }
      }

      window.addEventListener('resize', syncCanvasSize);
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(syncCanvasSize).observe(viewport);
      }
      syncCanvasSize();
      initCascadeFiles();

      function drawTranslationFileCard(x, y, scale, file, alertT) {
        if (file.opacity <= 0.015) return;

        const cardW = 148 * scale;
        const cardH = 84 * scale;
        const fold = 15 * scale;

        const isCorrupt = file.corrupted && alertT > 0.05;
        const isBroken = file.broken && currentOutbreakLevel > 0.1;

        const jitterX = isCorrupt ? (Math.random() - 0.5) * (isBroken ? 6.0 : 3.2) * alertT : 0;
        const jitterY = isCorrupt ? (Math.random() - 0.5) * (isBroken ? 3.5 : 1.8) * alertT : 0;

        const baseAlpha = (0.42 + file.depth * 0.54) * file.opacity;

        ctx.save();
        ctx.translate(x + jitterX, y + jitterY);
        ctx.globalAlpha = Math.max(0, Math.min(1, file.opacity));

        if (isBroken) {
          const splitGap = 7 * scale * currentOutbreakLevel;
          const tilt = 0.085 * currentOutbreakLevel;

          ctx.save();
          ctx.translate(-splitGap * 0.6, -splitGap * 0.4);
          ctx.rotate(-tilt);
          ctx.beginPath();
          ctx.moveTo(-cardW / 2, -cardH / 2);
          ctx.lineTo(cardW / 2 - fold, -cardH / 2);
          ctx.lineTo(cardW / 2, -cardH / 2 + fold);
          ctx.lineTo(cardW / 2, -4 * scale);
          ctx.lineTo(6 * scale, 4 * scale);
          ctx.lineTo(-10 * scale, -6 * scale);
          ctx.lineTo(-cardW / 2, 5 * scale);
          ctx.closePath();

          ctx.fillStyle = 'rgba(74, 10, 18, ' + (baseAlpha * 0.92).toFixed(3) + ')';
          ctx.strokeStyle = 'rgba(255, 62, 82, ' + (baseAlpha * 0.98).toFixed(3) + ')';
          ctx.lineWidth = 1.2 * scale;
          ctx.fill();
          ctx.stroke();

          const padX1 = -cardW / 2 + 10 * scale;
          const topY1 = -cardH / 2 + 16 * scale;
          ctx.font = 'bold ' + Math.max(7, Math.round(8.5 * scale)) + 'px "JetBrains Mono", Consolas, monospace';
          ctx.fillStyle = 'rgba(255, 95, 110, 0.95)';
          ctx.fillText('X BROKEN_FILE', padX1, topY1);
          ctx.font = Math.max(7, Math.round(8 * scale)) + 'px "JetBrains Mono", Consolas, monospace';
          ctx.fillStyle = 'rgba(240, 210, 215, 0.85)';
          ctx.fillText(corruptString(file.tpl.name, 0.85), padX1, topY1 + 13 * scale);
          ctx.restore();

          ctx.save();
          ctx.translate(splitGap * 0.7, splitGap * 0.65);
          ctx.rotate(tilt * 1.15);
          ctx.beginPath();
          ctx.moveTo(-cardW / 2, 9 * scale);
          ctx.lineTo(-10 * scale, -2 * scale);
          ctx.lineTo(6 * scale, 8 * scale);
          ctx.lineTo(cardW / 2, 0);
          ctx.lineTo(cardW / 2, cardH / 2);
          ctx.lineTo(-cardW / 2, cardH / 2);
          ctx.closePath();

          ctx.fillStyle = 'rgba(58, 8, 15, ' + (baseAlpha * 0.9).toFixed(3) + ')';
          ctx.strokeStyle = 'rgba(255, 62, 82, ' + (baseAlpha * 0.95).toFixed(3) + ')';
          ctx.lineWidth = 1.2 * scale;
          ctx.fill();
          ctx.stroke();

          const padX2 = -cardW / 2 + 10 * scale;
          ctx.font = 'bold ' + Math.max(7, Math.round(8.5 * scale)) + 'px "JetBrains Mono", Consolas, monospace';
          ctx.fillStyle = 'rgba(255, 78, 96, 0.92)';
          ctx.fillText('-> ' + corruptString('ERR_SEGMENT', 0.9), padX2, cardH / 2 - 12 * scale);
          ctx.restore();
        } else {
          ctx.beginPath();
          ctx.moveTo(-cardW / 2, -cardH / 2);
          ctx.lineTo(cardW / 2 - fold, -cardH / 2);
          ctx.lineTo(cardW / 2, -cardH / 2 + fold);
          ctx.lineTo(cardW / 2, cardH / 2);
          ctx.lineTo(-cardW / 2, cardH / 2);
          ctx.closePath();

          if (isCorrupt) {
            ctx.fillStyle = lerpRgba([16, 40, 34], [68, 10, 18], alertT, baseAlpha * 0.9);
            ctx.strokeStyle = lerpRgba([0, 245, 196], [255, 58, 78], alertT, baseAlpha * 0.98);
          } else {
            ctx.fillStyle = lerpRgba([14, 44, 36], [48, 12, 18], alertT, baseAlpha * 0.9);
            ctx.strokeStyle = lerpRgba([0, 245, 196], [255, 95, 110], alertT, baseAlpha * 0.85);
          }

          ctx.lineWidth = 1.2 * scale;
          ctx.fill();
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(cardW / 2 - fold, -cardH / 2);
          ctx.lineTo(cardW / 2 - fold, -cardH / 2 + fold);
          ctx.lineTo(cardW / 2, -cardH / 2 + fold);
          ctx.stroke();

          const padX = -cardW / 2 + 10 * scale;
          const topY = -cardH / 2 + 16 * scale;

          ctx.font = 'bold ' + Math.max(7, Math.round(8.8 * scale)) + 'px "JetBrains Mono", Consolas, monospace';
          ctx.textAlign = 'left';

          if (isCorrupt) {
            ctx.fillStyle = 'rgba(255, 90, 105, ' + Math.min(1, baseAlpha + 0.2).toFixed(3) + ')';
            ctx.fillText('! CORRUPTED_FILE', padX, topY);
          } else {
            ctx.fillStyle = lerpRgba(PALETTE.secondary[0], PALETTE.secondary[1], alertT, Math.min(1, baseAlpha + 0.2));
            ctx.fillText(file.tpl.lang, padX, topY);
          }

          ctx.font = Math.max(7, Math.round(8.2 * scale)) + 'px "JetBrains Mono", Consolas, monospace';
          ctx.fillStyle = 'rgba(225, 248, 242, ' + (baseAlpha * 0.92).toFixed(3) + ')';
          const fileName = isCorrupt ? corruptString(file.tpl.name, alertT) : file.tpl.name;
          ctx.fillText(fileName, padX, topY + 13 * scale);

          ctx.strokeStyle = isCorrupt
            ? 'rgba(255, 70, 90, ' + (baseAlpha * 0.5).toFixed(3) + ')'
            : lerpRgba(PALETTE.primary[0], PALETTE.primary[1], alertT, baseAlpha * 0.35);
          ctx.beginPath();
          ctx.moveTo(padX, topY + 19 * scale);
          ctx.lineTo(cardW / 2 - 10 * scale, topY + 19 * scale);
          ctx.stroke();

          ctx.font = 'bold ' + Math.max(7.2, Math.round(8.6 * scale)) + 'px "JetBrains Mono", Consolas, monospace';
          const srcText = isCorrupt ? corruptString(file.tpl.line1, alertT) : file.tpl.line1;
          const dstText = isCorrupt ? corruptString('0xDEAD_ERR_UTF8', alertT) : file.tpl.line2;

          ctx.fillStyle = 'rgba(205, 235, 228, ' + (baseAlpha * 0.88).toFixed(3) + ')';
          ctx.fillText(srcText, padX, topY + 32 * scale);

          ctx.fillStyle = isCorrupt
            ? 'rgba(255, 75, 92, ' + Math.min(1, baseAlpha + 0.22).toFixed(3) + ')'
            : lerpRgba(PALETTE.primary[0], PALETTE.primary[1], alertT, Math.min(1, baseAlpha + 0.22));
          ctx.fillText('-> ' + dstText, padX, topY + 46 * scale);

          if (isCorrupt && Math.random() < 0.3 * alertT) {
            ctx.fillStyle = 'rgba(255, 50, 75, ' + (0.25 * alertT).toFixed(3) + ')';
            const sliceY = (Math.random() - 0.5) * cardH * 0.7;
            ctx.fillRect(-cardW / 2, sliceY, cardW, 2.5 * scale);
          }
        }

        ctx.restore();
      }

      function drawVirusEntity(x, y, v, outbreakAlpha, now) {
        if (outbreakAlpha <= 0.02) return;

        const r = v.size;
        const rot = now * 0.0015 + v.phase;

        ctx.save();
        ctx.translate(x, y);
        ctx.globalAlpha = outbreakAlpha * 0.9;

        const glow = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r * 2.1);
        glow.addColorStop(0, 'rgba(255, 42, 68, 0.35)');
        glow.addColorStop(1, 'rgba(255, 42, 68, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0, 0, r * 2.1, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#ff3b52';
        ctx.fillStyle = '#ff6b7d';
        ctx.lineWidth = 1.6;
        const spikes = 8;
        for (let s = 0; s < spikes; s++) {
          const a = rot + (s * Math.PI * 2) / spikes;
          const sx = Math.cos(a) * (r * 1.45);
          const sy = Math.sin(a) * (r * 1.45);
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * (r * 0.65), Math.sin(a) * (r * 0.65));
          ctx.lineTo(sx, sy);
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(sx, sy, 2.1, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = '#3d0810';
        ctx.strokeStyle = '#ff3b52';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.72, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ff5268';
        ctx.font = 'bold 10px "JetBrains Mono", Consolas, monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('!', 0, 0.5);

        ctx.font = 'bold 8.5px "JetBrains Mono", Consolas, monospace';
        ctx.fillStyle = 'rgba(255, 130, 145, 0.92)';
        ctx.fillText(v.label, 0, r * 1.95);

        ctx.restore();
      }

      let lastTimestamp = performance.now();

      function renderCascadeScene(now) {
        const dt = Math.min(0.05, (now - lastTimestamp) / 1000);
        lastTimestamp = now;

        const authScreen = document.getElementById('authScreen');
        if (authScreen && authScreen.classList.contains('hidden')) {
          requestAnimationFrame(renderCascadeScene);
          return;
        }

        syncCanvasSize();

        currentRedLevel += (targetRedLevel - currentRedLevel) * 0.05;
        currentOutbreakLevel += (targetOutbreakLevel - currentOutbreakLevel) * 0.04;

        if (borderPulseEnergy > 0.001) {
          borderPulseTime += dt;
          borderPulseEnergy *= Math.pow(0.18, dt);
        } else {
          borderPulseEnergy = 0;
        }

        const pulseWave = Math.sin(borderPulseTime * 7.5) * borderPulseEnergy;
        const pulseHighlight = Math.max(0, pulseWave);

        applySvgGradientColors(currentRedLevel, pulseHighlight);

        for (let i = 0; i < layerElements.length; i++) {
          const el = layerElements[i];
          const idx = parseFloat(el.getAttribute('data-layer-index'));
          const phaseOffset = idx * 0.35;
          const localWave = Math.sin(Math.max(0, borderPulseTime - phaseOffset * 0.08) * 7.5) * borderPulseEnergy;
          const shiftX = localWave * (4.5 - idx * 0.6);
          const scale = 1 + localWave * 0.006;
          el.style.transform = 'translate3d(' + shiftX.toFixed(2) + 'px, 0, 0) scale(' + scale.toFixed(4) + ')';
        }

        const bgGrad = ctx.createLinearGradient(0, 0, width, height);
        bgGrad.addColorStop(0, lerpColor(PALETTE.bgTop[0], PALETTE.bgTop[1], currentRedLevel));
        bgGrad.addColorStop(1, lerpColor(PALETTE.bgBottom[0], PALETTE.bgBottom[1], currentRedLevel));
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, width, height);

        const usableStartX = width * 0.32;
        const usableWidth = width * 0.58;
        const cols = 5;

        ctx.save();
        for (let c = 0; c < cols; c++) {
          const lineX = usableStartX + ((c + 0.5) / cols) * usableWidth;
          const lineGrad = ctx.createLinearGradient(0, 0, 0, height);
          lineGrad.addColorStop(0, 'rgba(0,0,0,0)');
          lineGrad.addColorStop(0.5, lerpRgba(PALETTE.primary[0], PALETTE.primary[1], currentRedLevel, 0.14));
          lineGrad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.strokeStyle = lineGrad;
          ctx.lineWidth = 1;
          ctx.setLineDash([5, 11]);
          ctx.beginPath();
          ctx.moveTo(lineX, 0);
          ctx.lineTo(lineX, height);
          ctx.stroke();
        }
        ctx.restore();

        const totalSpanY = height + 210;

        for (let i = 0; i < cascadeFiles.length; i++) {
          const file = cascadeFiles[i];
          file.yNorm += file.speed * dt;
          file.opacity += (file.targetOpacity - file.opacity) * 0.045;

          if (file.yNorm > 1) {
            file.yNorm -= 1;
            if (errorCount === 0) {
              file.corrupted = false;
              file.broken = false;
              file.vanishing = false;
              file.targetOpacity = 1.0;
            } else if (errorCount < 4) {
              file.corrupted = file.rank < (errorCount / 3);
            } else {
              file.corrupted = true;
              file.roleSeed = Math.random();
              if (file.roleSeed < 0.42) {
                file.broken = true;
                file.vanishing = false;
                file.targetOpacity = 0.85;
              } else if (file.roleSeed < 0.82) {
                file.broken = false;
                file.vanishing = true;
                file.opacity = 0.75;
                file.targetOpacity = 0.0;
              } else {
                file.broken = false;
                file.vanishing = false;
                file.targetOpacity = 0.95;
              }
            }
          }

          const sway = Math.sin(now * 0.0009 + file.swayPhase) * 4.5 * file.depth;
          const x = usableStartX + file.colRatio * usableWidth + sway;
          const y = -105 + file.yNorm * totalSpanY;
          const scale = 0.64 + file.depth * 0.48;

          drawTranslationFileCard(x, y, scale, file, currentRedLevel);
        }

        if (currentOutbreakLevel > 0.01) {
          for (let i = 0; i < virusEntities.length; i++) {
            const v = virusEntities[i];
            v.yNorm += v.speed * dt;
            if (v.yNorm > 1) {
              v.yNorm -= 1;
            }
            const vx = usableStartX + v.colRatio * usableWidth + Math.sin(now * 0.0018 * v.wobbleFreq + v.phase) * 18;
            const vy = -60 + v.yNorm * (height + 120);
            drawVirusEntity(vx, vy, v, currentOutbreakLevel, now);
          }
        }

        requestAnimationFrame(renderCascadeScene);
      }

      requestAnimationFrame(renderCascadeScene);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initTranslationCascade);
    } else {
      initTranslationCascade();
    }
  </script>
</body>
</html>
